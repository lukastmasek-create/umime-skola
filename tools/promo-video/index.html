<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Promo TikTok</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#17103a;--cream:#fff6e0;--coral:#ff6a4d;--yellow:#ffc933;--blue:#3248f0;--peri:#8b9bff;--green:#3ddc97}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0828}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Onest,system-ui,sans-serif;color:#fff}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.scene{position:absolute;inset:0;opacity:0}
.h{font-family:Unbounded,Onest,sans-serif;font-weight:800;line-height:1.12;text-align:center;letter-spacing:-.01em;text-shadow:0 6px 0 rgba(10,5,40,.55)}
.w{display:inline-block;white-space:pre}
.hand{font-family:Pangolin,Onest,sans-serif;font-weight:400}
.card{position:absolute;border:8px solid var(--ink);border-radius:40px;box-shadow:12px 14px 0 rgba(8,4,32,.7)}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;border:7px solid var(--ink);border-radius:999px;box-shadow:8px 10px 0 rgba(8,4,32,.7);font-family:Onest;font-weight:800;color:var(--ink)}
.mono{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:44px;line-height:70px;white-space:pre}
#bar{position:absolute;left:60px;top:44px;width:960px;height:10px;border-radius:9px;background:rgba(255,255,255,.22)}
#barf{position:absolute;left:0;top:0;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--yellow),var(--coral))}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0;background:linear-gradient(#1b0d4a,#0e0828)"></div>
  <div id="neb1" class="abs" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(150,70,230,.55),transparent 65%);filter:blur(30px)"></div>
  <div id="neb2" class="abs" style="width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(60,90,255,.45),transparent 65%);filter:blur(30px)"></div>
  <canvas id="stars" width="1080" height="1920" class="abs"></canvas>
  <img id="planet" class="abs" src="../../public/home/planeta.webp" style="width:760px">

  <!-- SCENE 1: hook -->
  <div class="scene" id="s1">
    <img id="s1logo" class="abs" src="../../public/brand/logo-tmave.svg" style="left:90px;top:210px;width:900px">
    <svg id="s1trail" class="abs" width="1080" height="1920" style="left:0;top:0"></svg>
    <div id="s1head" class="h" style="position:absolute;left:0;top:500px;width:1080px;font-size:116px"></div>
    <svg class="abs" width="1080" height="200" style="left:0;top:880px;overflow:visible" id="s1ul"><path pathLength="1" d="M150 40 C 330 12, 560 62, 930 22" fill="none" stroke="#ffc933" stroke-width="16" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#rough)"/></svg>
    <div id="s1chips"></div>
    <img id="s1rocket" class="abs" src="../../public/home/anim/raketa-still.webp" style="width:150px;left:-75px;top:-94px">
  </div>

  <!-- SCENE 2: subjects -->
  <div class="scene" id="s2">
    <div id="s2title" class="h" style="position:absolute;left:0;top:150px;width:1080px;font-size:76px"></div>
    <div id="s2cards"></div>
  </div>

  <!-- SCENE 3: code -->
  <div class="scene" id="s3">
    <div id="s3title" class="h" style="position:absolute;left:0;top:150px;width:1080px;font-size:76px"></div>
    <div id="s3editor" class="card abs" style="left:70px;top:430px;width:940px;height:470px;background:#14102f;overflow:hidden">
      <div style="position:absolute;left:34px;top:26px;display:flex;gap:14px">
        <i style="width:22px;height:22px;border-radius:50%;background:#ff6a4d"></i><i style="width:22px;height:22px;border-radius:50%;background:#ffc933"></i><i style="width:22px;height:22px;border-radius:50%;background:#3ddc97"></i>
      </div>
      <div id="s3code" class="mono" style="position:absolute;left:36px;top:96px"></div>
      <div id="s3cur" style="position:absolute;width:6px;height:52px;background:#ffc933;border-radius:3px"></div>
    </div>
    <div id="s3res" class="card abs" style="left:70px;top:960px;width:940px;height:340px;background:#fff6e0;color:var(--ink)">
      <div class="h" style="position:absolute;left:44px;top:46px;width:850px;text-align:left;font-size:72px;color:var(--ink);text-shadow:none">Ahoj, světe!</div>
      <div style="position:absolute;left:46px;top:170px;font:800 40px Onest">Tohle jsem napsal/a sám/a.</div>
      <div id="s3ok" class="pill" style="left:46px;top:236px;height:70px;padding:0 30px;background:#3ddc97;font-size:34px;border-width:6px">Hotovo
        <svg width="40" height="36" viewBox="0 0 40 36" style="margin-left:12px"><path pathLength="1" id="s3tick" d="M5 19 L16 30 L35 5" fill="none" stroke="#17103a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
      </div>
    </div>
  </div>

  <!-- SCENE 4: AI -->
  <div class="scene" id="s4">
    <div id="s4title" class="h" style="position:absolute;left:0;top:150px;width:1080px;font-size:72px"></div>
    <div id="s4u" class="pill abs" style="left:300px;top:520px;height:140px;width:710px;background:#6f86ff;border-radius:50px 50px 12px 50px;font-size:56px;color:#fff;text-shadow:0 3px 0 rgba(10,5,40,.4)">Nechápu zlomky&hellip;</div>
    <svg id="s4bot" class="abs" width="150" height="150" viewBox="0 0 150 150" style="left:60px;top:790px">
      <path d="M75 10 L75 28" stroke="#17103a" stroke-width="8" stroke-linecap="round"/><circle cx="75" cy="10" r="10" fill="#ff6a4d" stroke="#17103a" stroke-width="6"/>
      <rect x="18" y="30" width="114" height="100" rx="34" fill="#ffc933" stroke="#17103a" stroke-width="8"/>
      <circle cx="53" cy="76" r="14" fill="#fff" stroke="#17103a" stroke-width="6"/><circle cx="97" cy="76" r="14" fill="#fff" stroke="#17103a" stroke-width="6"/>
      <circle id="s4pl" cx="53" cy="78" r="6" fill="#17103a"/><circle id="s4pr" cx="97" cy="78" r="6" fill="#17103a"/>
      <path d="M52 104 Q75 120 98 104" fill="none" stroke="#17103a" stroke-width="7" stroke-linecap="round"/>
    </svg>
    <div id="s4dots" class="pill abs" style="left:230px;top:800px;height:110px;width:220px;background:#fff6e0;border-radius:46px 46px 46px 12px;gap:18px">
      <i class="d" style="width:22px;height:22px;border-radius:50%;background:#17103a"></i><i class="d" style="width:22px;height:22px;border-radius:50%;background:#17103a"></i><i class="d" style="width:22px;height:22px;border-radius:50%;background:#17103a"></i>
    </div>
    <div id="s4a" class="pill abs" style="left:230px;top:740px;height:280px;width:780px;background:#fff6e0;border-radius:50px 50px 50px 12px;font-size:56px;text-align:left;justify-content:flex-start;padding-left:50px;line-height:1.25;white-space:pre">Pizza na 8 dílků.
Sníš 3, zbyde 5/8.</div>
    <svg id="s4pizza" class="abs" width="300" height="300" viewBox="0 0 250 250" style="left:70px;top:1090px;overflow:visible">
      <g filter="url(#rough)">
        <circle pathLength="1" class="pz" cx="125" cy="125" r="100" fill="#ffc933" stroke="#17103a" stroke-width="9" stroke-dasharray="1" stroke-dashoffset="1"/>
        <path pathLength="1" class="pz" d="M125 25 V225 M25 125 H225 M54 54 L196 196 M196 54 L54 196" stroke="#17103a" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/>
        <circle class="pp" cx="90" cy="85" r="14" fill="#ff6a4d"/><circle class="pp" cx="165" cy="100" r="14" fill="#ff6a4d"/><circle class="pp" cx="110" cy="170" r="14" fill="#ff6a4d"/><circle class="pp" cx="175" cy="168" r="14" fill="#ff6a4d"/>
      </g>
    </svg>
    <svg id="s4xp" class="abs" width="280" height="280" viewBox="0 0 260 260" style="left:700px;top:1290px;overflow:visible">
      <path d="M130 8 L160 88 L246 92 L178 148 L202 232 L130 184 L58 232 L82 148 L14 92 L100 88 Z" fill="#ffc933" stroke="#17103a" stroke-width="9" stroke-linejoin="round"/>
      <text x="130" y="152" text-anchor="middle" font-family="Unbounded" font-weight="800" font-size="46" fill="#17103a">+10</text>
    </svg>
    <div id="s4done" class="pill abs" style="left:390px;top:1120px;height:140px;width:620px;background:#3ddc97;font-size:46px;color:#17103a">Aha, už to dává smysl!</div>
  </div>

  <!-- SCENE 5: games -->
  <div class="scene" id="s5">
    <div id="s5title" class="h" style="position:absolute;left:0;top:150px;width:1080px;font-size:84px"></div>
    <div id="s5names"></div>
    <div id="s5view" class="card abs" style="left:82px;top:560px;width:916px;height:816px;overflow:hidden;background:#222">
      <svg id="g1" width="900" height="800" viewBox="0 0 900 800" style="position:absolute;left:0;top:0"></svg>
      <svg id="g2" width="900" height="800" viewBox="0 0 900 800" style="position:absolute;left:0;top:0"></svg>
      <svg id="g3" width="900" height="800" viewBox="0 0 900 800" style="position:absolute;left:0;top:0"></svg>
    </div>
    <div id="s5dots"></div>
  </div>

  <!-- SCENE 6: outro -->
  <div class="scene" id="s6">
    <div id="s6words"></div>
    <svg class="abs" width="1080" height="120" style="left:0;top:780px;overflow:visible"><path id="s6ul" pathLength="1" d="M300 40 C 450 14, 650 58, 790 26" fill="none" stroke="#ffc933" stroke-width="16" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#rough)"/></svg>
    <svg id="s6spark" class="abs" width="1080" height="1000" style="left:0;top:0;overflow:visible"></svg>
    <img id="s6logo" class="abs" src="../../public/brand/logo-tmave.svg" style="left:110px;top:940px;width:860px">
    <div id="s6url" class="pill abs" style="left:190px;top:1090px;height:96px;width:700px;background:var(--cream);font-size:48px;letter-spacing:.01em">ucimesehrou.org</div>
    <div id="s6cta" class="pill abs" style="left:240px;top:1230px;height:130px;width:600px;background:var(--blue);color:#fff;font-size:62px;gap:20px;text-shadow:0 4px 0 rgba(10,5,40,.4)">Zkus to teď
      <svg width="62" height="52" viewBox="0 0 62 52"><path d="M6 26 H50 M32 8 L52 26 L32 44" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div id="s6chips"></div>
  </div>

  <div id="bar"><div id="barf"></div></div>

  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="6"/></filter>
  </defs></svg>
</div>

<script>
/* ---------- pomocné funkce: žádná náhoda, vše se počítá z času t ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const eo3=x=>1-Math.pow(1-x,3);
const eob=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
const tf=(el,x=0,y=0,s=1,r=0,o=1)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;el.style.opacity=o;};
const sg=(el,x=0,y=0,s=1,r=0,sy=null)=>el.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s} ${sy??s})`);
const NS='http://www.w3.org/2000/svg';
const svgEl=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* slova se skládají předem do layoutu (inline-block), animuje se jen transform/opacity -> nic se neposouvá */
function words(parent,text,style=''){
  return text.split(' ').map((w,i,a)=>{const s=document.createElement('span');s.className='w';s.textContent=w+(i<a.length-1?' ':'');if(style)s.style.cssText=style;parent.appendChild(s);return s;});
}
function lines(parent,arr){ // arr: [[text,style],...]
  const out=[];arr.forEach(([t,st])=>{const d=document.createElement('div');parent.appendChild(d);out.push(...words(d,t,st));});return out;
}
const popIn=(el,t,s,d=.55,fromY=50,fromS=.7)=>{const p=prog(t,s,d);tf(el,0,(1-eob(p))*fromY,lerp(fromS,1,eob(p)),0,eo3(clamp(p*2.2)));};

/* ---------- pozadí ---------- */
const R=rng(11);
const stars=Array.from({length:150},()=>({x:R()*1080,y:R()*1960,r:.8+R()*2.4,sp:6+R()*26,tw:.6+R()*1.6,ph:R()*6.28}));
const cv=$('stars'),cx=cv.getContext('2d');
function drawBg(t){
  cx.clearRect(0,0,1080,1920);
  for(const s of stars){
    const y=((s.y+s.sp*t)%1960)-20;
    const a=.35+.65*Math.pow(.5+.5*Math.sin(t*s.tw+s.ph),2);
    cx.globalAlpha=a;cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,y,s.r,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;
  tf($('neb1'),-250+Math.sin(t*.35)*60,100+Math.cos(t*.3)*50);
  tf($('neb2'),380+Math.cos(t*.28)*70,950+Math.sin(t*.33)*60);
  tf($('planet'),-150+Math.sin(t*.4)*14,1500+Math.cos(t*.5)*14,1,-6+t*.4,.95);
}

/* ---------- scény: okna ---------- */
const SC=[['s1',0,3.2],['s2',3.2,6.4],['s3',6.4,9.6],['s4',9.6,12.8],['s5',12.8,16.4],['s6',16.4,20]];
const TOTAL=20, FADE=.28;

/* S1 */
const s1h=lines($('s1head'),[['Učení,'],['které tě'],['fakt baví.','color:#ffc933']]);
const chipData=[['Hry','#ff6a4d',-6],['Kurzy','#8b9bff',4],['AI doučovač','#3ddc97',-3]];
const s1chips=chipData.map(([t,c,r],i)=>{const d=document.createElement('div');d.className='pill';d.textContent=t;d.style.cssText=`left:0;top:0;height:110px;padding:0 44px;background:${c};font-size:56px;position:absolute;will-change:transform`;$('s1chips').appendChild(d);return d;});
const s1ChipX=[60,360,590];
function S1(lt){
  popIn($('s1logo'),lt,.1,.7,-120,.8);
  s1h.forEach((w,i)=>popIn(w,lt,.55+i*.2,.55,60,.8));
  $('s1ul').querySelector('path').setAttribute('stroke-dashoffset',1-eo3(prog(lt,1.1,.55)));
  const cw=s1chips.map(c=>c.offsetWidth||200);let cxp=(1080-(cw.reduce((x,y)=>x+y,0)+24*2))/2;const cxs=cw.map(w=>{const v=cxp;cxp+=w+24;return v;});
  s1chips.forEach((c,i)=>{const p=prog(lt,1.7+i*.14,.5);c.style.left='0';c.style.top='0';tf(c,cxs[i],1140,lerp(.5,1,eob(p)),chipData[i][2],eo3(clamp(p*2.5)));});
  // raketa: čistá bezierka, tečna určuje natočení
  const bz=(p)=>{const P=[[-140,1720],[260,1480],[740,1560],[1240,980]];const u=1-p;
    const x=u*u*u*P[0][0]+3*u*u*p*P[1][0]+3*u*p*p*P[2][0]+p*p*p*P[3][0];
    const y=u*u*u*P[0][1]+3*u*u*p*P[1][1]+3*u*p*p*P[2][1]+p*p*p*P[3][1];return[x,y];};
  const p=eio(prog(lt,.1,2.5));const[x,y]=bz(p);const[x2,y2]=bz(Math.min(1,p+.01));
  const ang=Math.atan2(x2-x,-(y2-y))*180/Math.PI;
  tf($('s1rocket'),x,y,1,ang,p>0&&p<1?1:0);
  const tr=$('s1trail');tr.innerHTML='';
  for(let k=1;k<=14;k++){const q=p-k*.022;if(q<=0)break;const[px,py]=bz(q);
    svgEl('circle',{cx:px,cy:py,r:(22-k*1.2)*(1),fill:'none',stroke:'#fff6e0','stroke-width':5,opacity:(1-k/15)*.8},tr);}
}
/* S2 */
const s2w=lines($('s2title'),[['Kurzy'],['ze všech předmětů']]);
const subj=[['cestina','Čeština','#ffc933',-2.5],['matematika','Matika','#5ab0ff',2],['anglictina','Angličtina','#3ddc97',2],['chemie','Chemie','#ff7a59',-2],['hudebka','Hudebka','#8b7bff',-2],['dejepis','Dějepis','#ff7eb6',2.5]];
const s2c=subj.map(([f,n,c,r],i)=>{const d=document.createElement('div');d.className='card';
  const col=i%2,row=Math.floor(i/2);d.style.cssText=`left:${70+col*480}px;top:${400+row*360}px;width:460px;height:330px;background:${c};will-change:transform`;
  d.innerHTML=`<img src="../../public/home/predmet-${f}.webp" style="position:absolute;left:130px;top:10px;width:190px;height:190px;object-fit:contain"><div class="h" style="position:absolute;left:0;top:222px;width:444px;font-size:44px;color:var(--ink);text-shadow:none">${n}</div>`;
  $('s2cards').appendChild(d);return d;});
function S2(lt){
  s2w.forEach((w,i)=>popIn(w,lt,.05+i*.15,.5,50,.85));
  s2c.forEach((c,i)=>{const p=prog(lt,.35+i*.12,.55);const e=eob(p);
    const bob=Math.sin(lt*2.2+i*1.1)*5*clamp(p);
    tf(c,0,(1-e)*80+bob,lerp(.6,1,e),subj[i][3]*e,eo3(clamp(p*2.5)));});
}
/* S3 */
const s3w=lines($('s3title'),[['Kóduj přímo'],['v prohlížeči']]);
const CODE=['<h1>Ahoj, světe!</h1>','<p>Tohle jsem napsal/a sám/a.</p>'];
const CW=(()=>{const m=document.createElement('span');m.className='mono';m.style.cssText='position:absolute;visibility:hidden';m.textContent='M'.repeat(100);document.body.appendChild(m);const w=m.getBoundingClientRect().width/100;m.remove();return w;})();
const codeEl=$('s3code');const charEls=[];
CODE.forEach((ln,li)=>{const d=document.createElement('div');let inTag=false;
  [...ln].forEach(ch=>{if(ch==='<')inTag=true;const s=document.createElement('span');s.textContent=ch;s.style.color=inTag?'#ff8a70':'#f3ecff';if(ch==='>')inTag=false;d.appendChild(s);charEls.push({s,li});});
  codeEl.appendChild(d);});
const TOTALCH=charEls.length;
function S3(lt){
  s3w.forEach((w,i)=>popIn(w,lt,.05+i*.15,.5,50,.85));
  const e=$('s3editor');const p=prog(lt,.25,.55);tf(e,0,(1-eob(p))*90,lerp(.85,1,eob(p)),0,eo3(clamp(p*2.5)));
  const n=Math.floor(clamp((lt-.75)*38,0,TOTALCH));
  charEls.forEach((c,i)=>c.s.style.opacity=i<n?1:0);
  // pozice kurzoru z monospace šířky (žádné měření za běhu)
  let ci=n,li=0,col=0;for(let i=0;i<n;i++){}
  let rem=n;li=0;while(li<CODE.length-1&&rem>CODE[li].length){rem-=CODE[li].length;li++;}
  col=rem;
  const cur=$('s3cur');cur.style.left=(36+col*CW)+'px';cur.style.top=(96+li*70+12)+'px';
  cur.style.opacity=(n>=TOTALCH&&lt>2.2)?0:(Math.floor(lt*2.6)%2===0?1:.15);
  const pr=prog(lt,2.15,.55);tf($('s3res'),0,(1-eob(pr))*120,lerp(.85,1,eob(pr)),0,eo3(clamp(pr*2.5)));
  $('s3tick').setAttribute('stroke-dashoffset',1-eo3(prog(lt,2.55,.3)));
}
/* S4 */
const s4w=lines($('s4title'),[['AI doučovač,'],['co ti to vysvětlí']]);
function S4(lt){
  s4w.forEach((w,i)=>popIn(w,lt,.05+i*.15,.5,50,.85));
  popIn($('s4u'),lt,.35,.5,60,.8);
  const pb=prog(lt,.75,.45);
  tf($('s4bot'),0,(1-eob(pb))*70,lerp(.6,1,eob(pb)),0,eo3(clamp(pb*2.5)));
  const dotsVis=lt>.95&&lt<1.75;
  const pd=prog(lt,.95,.3),pdo=1-prog(lt,1.55,.2);
  tf($('s4dots'),0,(1-eob(pd))*40,1,0,dotsVis?eo3(pd)*pdo:0);
  [...$('s4dots').querySelectorAll('.d')].forEach((d,i)=>{d.style.transform=`translateY(${-Math.abs(Math.sin(lt*7-i*.7))*14}px)`;});
  const pa=prog(lt,1.7,.5);tf($('s4a'),0,(1-eob(pa))*50,lerp(.8,1,eob(pa)),0,eo3(clamp(pa*2.5)));
  // pizza se kreslí tahem
  const pz=eo3(prog(lt,1.95,.6));
