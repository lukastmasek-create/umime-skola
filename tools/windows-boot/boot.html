<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Umíme školu – start</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0a1330;--y:#ffd24d;--g:#3ddc97;--b:#5ab8ff;--t:#e8eefc}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;cursor:none;color:var(--t);
    font-family:"Segoe UI",system-ui,sans-serif}
  body{display:grid;place-items:center;
    background:radial-gradient(ellipse at 50% 60%,#14224f 0%,var(--bg) 70%)}
  .stars{position:fixed;inset:0}
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:3.2vh;z-index:1}
  .logo{display:flex;gap:1.2vmin;align-items:flex-end;height:18vmin}
  .logo i{display:block;width:5vmin;border-radius:1vmin;transform-origin:bottom;
    animation:rise 1s cubic-bezier(.2,.9,.3,1.2) both, bob 2.4s ease-in-out 1.4s infinite}
  .logo i:nth-child(1){background:var(--y);height:9vmin;animation-delay:.1s,1.4s}
  .logo i:nth-child(2){background:var(--g);height:14vmin;animation-delay:.25s,1.55s}
  .logo i:nth-child(3){background:var(--b);height:18vmin;animation-delay:.4s,1.7s}
  .logo i:nth-child(4){background:var(--y);height:12vmin;animation-delay:.55s,1.85s}
  .logo i:nth-child(5){background:var(--g);height:7vmin;animation-delay:.7s,2s}
  @keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
  @keyframes bob{50%{transform:scaleY(.82)}}
  h1{font-size:7vmin;letter-spacing:.04em;font-weight:700;opacity:0;animation:fade 1s ease 1s forwards}
  h1 b{color:var(--y)}
  .sub{font-size:2.4vmin;opacity:0;letter-spacing:.3em;text-transform:uppercase;color:#9fb2e0;
    animation:fade 1s ease 1.6s forwards}
  @keyframes fade{to{opacity:1}}
  .bar{width:36vmin;height:.9vmin;background:#1b2a5c;border-radius:1vmin;overflow:hidden;
    opacity:0;animation:fade .6s ease 2s forwards}
  .bar span{display:block;height:100%;width:0;border-radius:1vmin;
    background:linear-gradient(90deg,var(--y),var(--g),var(--b));animation:load var(--dur,6s) ease-in-out 2s forwards}
  @keyframes load{to{width:100%}}
  .msg{font-size:2vmin;color:#7f93c6;height:3vmin;opacity:0;animation:fade .6s ease 2.2s forwards}
  .out{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;
    animation:fade 1s ease calc(var(--dur,6s) + 1.6s) forwards}
</style>
</head>
<body>
<canvas class="stars" id="c"></canvas>
<div class="stage">
  <div class="logo"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Umíme <b>školu</b></h1>
  <div class="sub">Startuji systém</div>
  <div class="bar"><span></span></div>
  <div class="msg" id="m"></div>
</div>
<div class="out"></div>
<script>
// délka animace: boot.html?dur=8 (sekundy)
const q=new URLSearchParams(location.search);
const dur=Math.min(60,Math.max(2,+q.get('dur')||6));
document.documentElement.style.setProperty('--dur',dur+'s');

const msgs=["Zapínám světla…","Rozcvičuji mozek…","Načítám kurzy…","Ostřím tužky…","Skoro hotovo…"];
const m=document.getElementById('m');
msgs.forEach((t,i)=>setTimeout(()=>m.textContent=t,2200+i*(dur*1000/msgs.length)));

// hvězdy
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,S=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight;
  S=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.6+.3,v:Math.random()*.25+.05,p:Math.random()*6}))}
size();addEventListener('resize',size);
(function f(t){x.clearRect(0,0,W,H);
  for(const s of S){s.y-=s.v;if(s.y<0)s.y=H;
    x.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));
    x.fillStyle='#cfe0ff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.3);x.fill()}
  requestAnimationFrame(f)})(0);
</script>
</body>
</html>
