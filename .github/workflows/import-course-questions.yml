name: Import course questions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-course-questions.yml"
      - "prisma/build-courses-sql.cjs"
      - "prisma/content/**"
      - "prisma/content-extra/**"
      - "prisma/sql/courses-*.sql"
      - "prisma/sql/subject-*.sql"
      - "scripts/import-course-sql.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-course-questions
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate current course SQL
        run: node prisma/build-courses-sql.cjs

      - name: Import courses and questions into PostgreSQL
        run: node scripts/import-course-sql.cjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
