# Nasazení na Cloudflare Workers (produkce ucimesehrou.org). Spustí se po pushi do main
# nebo ručně v záložce Actions. Potřebuje dva secrety v GitHubu:
#   CLOUDFLARE_API_TOKEN  (token s oprávněním Workers Scripts: Edit, Account Settings: Read)
#   CLOUDFLARE_ACCOUNT_ID (ID účtu Cloudflare)
name: Deploy na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Build pro Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Nasazení workeru umime-skola
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
