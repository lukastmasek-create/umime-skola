# Nasazení na Cloudflare Workers (produkce ucimesehrou.org). Spustí se po pushi do main
# nebo ručně v záložce Actions. Potřebuje dva secrety v GitHubu:
#   CLOUDFLARE_API_TOKEN  (token s oprávněním Workers Scripts: Edit, Account Settings: Read)
#   CLOUDFLARE_ACCOUNT_ID (ID účtu Cloudflare)
name: Deploy na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Build pro Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Nasazení workeru umime-skola
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


      - name: Ověření produkce po nasazení
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 -o /dev/null https://ucimesehrou.org/cs
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 https://ucimesehrou.org/api/live/courses |
            node -e 'const fs = require("node:fs"); const courses = JSON.parse(fs.readFileSync(0, "utf8")); if (!Array.isArray(courses) || !courses.some(course => course.questions >= 3)) process.exit(1);'
