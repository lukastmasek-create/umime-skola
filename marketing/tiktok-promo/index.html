<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Učíme se hrou – TikTok promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@500;700;800&family=Pangolin&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12102a; --text:#f6f1e4; --line:#f6f1e4; --shadow:#05040f; --surface:#1c1936; --surface2:#26224a; --edge:#6a63ad;
  --brand:#5a6cff; --brand-600:#8d99ff; --orange:#ff7a5c; --yellow:#ffd24d; --green:#3ddc97; --blue:#5ab8ff; --purple:#9085e9;
  --font-head:"Unbounded",system-ui,sans-serif; --font-body:"Onest",system-ui,sans-serif; --font-hero:"Pangolin","Onest",cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-body);color:var(--text)}
#stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(900px 700px at 80% 12%, #2a2a7a55, transparent 70%),
  radial-gradient(800px 800px at 10% 90%, #3a1f5c55, transparent 70%),
  var(--bg)}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#f6f1e422 1.4px,transparent 1.6px);background-size:34px 34px}
#deco{position:absolute;inset:0;pointer-events:none}
#deco img{position:absolute;opacity:.42;filter:drop-shadow(0 6px 0 #05040f)}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.abs{position:absolute}
.title{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-head);font-weight:900;font-size:76px;line-height:1;letter-spacing:-1px;white-space:nowrap}
.sk{border:7px solid var(--line);border-radius:34px;background:var(--surface);box-shadow:16px 16px 0 var(--shadow);filter:url(#rough)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:430px;color:#12102a;font-family:var(--font-head);font-weight:800;font-size:56px}
.card img{width:210px;height:210px;object-fit:contain}
.bubble{position:absolute;padding:36px 44px;font-size:54px;font-weight:700;line-height:1.2;border:7px solid var(--line);border-radius:36px;box-shadow:14px 14px 0 var(--shadow);background:var(--surface);color:var(--text);filter:url(#rough)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:6px solid var(--line)}
.memo{position:relative;height:215px;perspective:900px}
.inner{position:absolute;inset:0;transform-style:preserve-3d}
.face.b{background:var(--brand);color:#fff;font-family:var(--font-head);font-size:110px;font-weight:900}
.face.f{transform:rotateY(180deg);background:var(--surface2)}
.face.f img{width:150px;height:150px;object-fit:contain}
.spr{position:absolute;image-rendering:pixelated;background-repeat:no-repeat}
.pop{position:absolute;font-family:var(--font-head);font-size:80px;font-weight:900;color:var(--green);text-shadow:4px 4px 0 var(--shadow)}
.bar{position:absolute;left:60px;top:44px;width:960px;height:16px;border:5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;z-index:50}
.bar i{display:block;height:100%;background:var(--orange)}
.cta{position:absolute;left:50%;transform:translateX(-50%);padding:36px 76px;font-family:var(--font-head);font-size:64px;font-weight:900;color:#fff;background:var(--brand);border:7px solid var(--line);border-radius:999px;box-shadow:16px 16px 0 var(--shadow);white-space:nowrap}
.tag{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-hero);font-size:84px;font-weight:400;line-height:1.1}
.code{font-family:"Courier New",monospace;color:#f6f1e4;font-size:58px;line-height:1.45;white-space:pre-wrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="8"/></filter>
</svg>
<div id="stage"><div class="abs" style="inset:0;background:url(../../public/game-sprites/space/pozadi_mlhovina.webp) center/cover;opacity:.55"></div><video id="bgvid" muted playsinline preload="auto" src="../../public/home/hvezdy.webm" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;opacity:.45"></video><div class="bar"><i id="prog"></i></div></div>

<script>
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = x => 1 - Math.pow(1 - x, 3);
const OB = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const typed = (s, p) => s.slice(0, Math.floor(s.length * p));
const SITE = '../../public/';
const SCENES = [];
const DUR = 29.1;

function scene(id, start, end, html, update) {
  const el = document.createElement('div');
  el.className = 'scene';
  el.id = id;
  el.innerHTML = html;
  $('#stage').appendChild(el);
  const s = { el, start, end, update: update || (() => {}), q: sel => el.querySelector(sel), qa: sel => [...el.querySelectorAll(sel)] };
  SCENES.push(s);
  return s;
}

/* Vykreslí jeden snímek ze sprite sheetu webu (stejné soubory a rozměry jako v game-sprites/*.json). */
const sprStyle = (file, cw, ch, cols, col, row, scale) => {
  const w = cw * scale, h = ch * scale;
  return `background-image:url(${SITE}${file});background-size:${cols * w}px auto;background-position:${-col * w}px ${-row * h}px;width:${w}px;height:${h}px`;
};
const setSpr = (el, file, cw, ch, cols, col, row, scale) => {
  // Nastaví jen to, co se změnilo (bez přepisování celého style), aby sprity nebliká.
  const k = [file, cw, ch, cols, col, row, scale].join('|');
  if (el.dataset.k === k) return;
  el.dataset.k = k;
  const w = cw * scale, h = ch * scale;
  el.style.backgroundImage = 'url(' + SITE + file + ')';
  el.style.backgroundSize = (cols * w) + 'px auto';
  el.style.backgroundPosition = (-col * w) + 'px ' + (-row * h) + 'px';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
};

const SUBJECTS = [
  ['Čeština', 'cestina'], ['Matematika', 'matematika'], ['Angličtina', 'anglictina'],
  ['Chemie', 'chemie'], ['Hudebka', 'hudebka'], ['Informatika', 'informatika']
];
const CARD_BG = ['#ffd24d', '#5ab8ff', '#3ddc97', '#ff7a5c', '#9085e9', '#8d99ff'];

/* ---------- S1: hook ---------- */
scene('s1', 0, 3.9, `
  <div class="abs" style="left:50%;top:620px;width:1000px;height:1000px;margin-left:-500px;border-radius:50%;background:radial-gradient(circle,#5a6cff55,transparent 65%)"></div>
  <img class="abs" src="${SITE}home/oblak-1.webp" style="left:-60px;top:240px;width:460px;opacity:.9">
  <img class="abs" src="${SITE}home/oblak-2.webp" style="right:-80px;top:420px;width:420px;opacity:.9">
  <img class="abs" src="${SITE}home/anim/hory-predni.webp" style="left:0;bottom:0;width:1080px">
  <img class="abs logo" src="${SITE}brand/logo-tmave.svg" style="left:70px;top:560px;width:940px">
  <svg class="abs" style="left:0;top:0" width="1080" height="1920">
    <path class="ul" pathLength="1" d="M120 720 Q400 688 620 716 T1000 704" fill="none" stroke="#ff7a5c" stroke-width="18" stroke-linecap="round"/>
  </svg>
  <div class="tag" id="tag1" style="top:1010px"></div>
  <img class="abs rocket" src="${SITE}home/raketa.webp" style="width:320px;left:-320px;top:1180px">
`, (lt, s) => {
  const logo = s.q('.logo');
  logo.style.transform = `scale(${0.6 + 0.4 * OB(P(lt, 0, 0.7))})`;
  logo.style.opacity = P(lt, 0, 0.3);
  const ul = s.q('.ul');
  ul.style.strokeDasharray = '1';
  ul.style.strokeDashoffset = 1 - E(P(lt, 0.8, 1.6));
  s.q('#tag1').textContent = typed('Objevte svět, kde učení baví', P(lt, 1.0, 2.4));
  const r = s.q('.rocket');
  const rp = E(P(lt, 0.1, 2.4));
  r.style.transform = `translate(${rp * 1400}px, ${-rp * 700}px) rotate(-8deg)`;
  s.qa('img[src*="oblak"]').forEach((c, i) => c.style.transform = `translateX(${Math.sin(lt * 0.8 + i) * 30}px)`);
});

/* ---------- S2: předměty ---------- */
scene('s2', 3.9, 8.2, `
  <div class="title" style="top:200px;font-size:72px">Kurzy pro každého</div>
  <div class="abs" style="left:70px;top:420px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:44px">
    ${SUBJECTS.map(([name, icon], i) => `<div class="sk card" style="background:${CARD_BG[i]}"><img src="${SITE}ikony/${icon}.svg" alt=""><span>${name}</span></div>`).join('')}
  </div>
  <img class="abs" src="${SITE}home/funkce-kurzy.webp" style="left:-40px;bottom:120px;width:300px;transform:rotate(-8deg)">
`, (lt, s) => {
  s.qa('.card').forEach((c, i) => {
    const p = P(lt, 0.2 + i * 0.2, 0.7 + i * 0.2);
    c.style.transform = `scale(${OB(p)})`;
    c.style.opacity = p > 0 ? 1 : 0;
  });
});

/* ---------- S3: kód ---------- */
const CODE = '<h1>Ahoj, světe!</h1>\n<p>Tohle jsem napsal/a sám/a.</p>';
scene('s3', 8.2, 13.1, `
  <div class="title" style="top:180px;font-size:66px">Kód hned v prohlížeči</div>
  <div class="sk abs" style="left:70px;top:420px;width:940px;height:640px;background:#0b0a1f;padding:48px;box-shadow:16px 16px 0 var(--brand)">
    <pre class="code"></pre>
  </div>
  <div class="sk abs prev" style="left:70px;top:1140px;width:940px;height:620px;padding:64px">
    <h1 style="font-family:var(--font-head);color:var(--brand-600);font-size:124px;font-weight:900;line-height:1">Ahoj, světe!</h1>
    <p style="font-size:60px;margin-top:34px;font-weight:700">Tohle jsem napsal/a sám/a.</p>
    <div class="cta" style="position:relative;left:auto;transform:none;margin-top:54px;display:inline-block;font-size:56px;padding:28px 60px">Hotovo</div>
  </div>
`, (lt, s) => {
  s.q('.code').textContent = typed(CODE, P(lt, 0.6, 3.2));
  const p = P(lt, 3.3, 3.9);
  s.q('.prev').style.transform = `scale(${0.85 + 0.15 * OB(p)})`;
  s.q('.prev').style.opacity = p;
});

/* ---------- S4: AI doučovač + foto → pexeso ---------- */
const PAIRS = ['cestina', 'matematika', 'anglictina', 'chemie', 'hudebka', 'informatika'];
const memoCards = [...PAIRS, ...PAIRS].map(icon => `
  <div class="memo"><div class="inner">
    <div class="face b">?</div>
    <div class="face f"><img src="${SITE}ikony/${icon}.svg" alt=""></div>
  </div></div>`).join('');
scene('s4', 13.1, 17.8, `
  <div class="title" style="top:170px">AI doučovač</div>
  <div class="sk abs photo" style="left:70px;top:380px;width:460px;height:360px;overflow:hidden;background:linear-gradient(#ffd24d,#ff7a5c)">
    <img src="${SITE}home/hory.webp" style="position:absolute;left:0;bottom:0;width:100%">
  </div>
  <div class="bubble" style="right:70px;top:400px;width:500px;background:var(--yellow);color:#12102a;font-weight:800">Udělej z téhle fotky hru!</div>
  <div class="bubble ai" style="left:70px;top:800px;width:900px;min-height:170px;opacity:0"><span class="dots" style="font-size:56px;letter-spacing:6px;opacity:0">...</span><span class="ait"></span></div>
  <div class="abs" style="left:70px;top:1060px;width:940px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px">${memoCards}</div>
`, (lt, s) => {
  const ph = P(lt, 0.1, 0.6);
  s.q('.photo').style.transform = `scale(${OB(ph)})`;
  s.q('.photo').style.opacity = ph;
  const b = s.q('.bubble:not(.ai)');
  b.style.transform = `translateX(${(1 - E(P(lt, 0.8, 1.1))) * 300}px)`;
  b.style.opacity = P(lt, 0.8, 1.0);
  s.q('.ai').style.opacity = P(lt, 1.6, 1.8);
  s.q('.dots').style.opacity = lt > 1.8 && lt < 2.5 ? 1 : 0;
  s.q('.ait').textContent = typed('Hotovo! Pexeso z 12 pojmů. Hrajem?', P(lt, 2.5, 3.4));
  s.qa('.inner').forEach((c, i) => {
    const p = P(lt, 2.3 + i * 0.06, 2.6 + i * 0.06);
    c.style.transform = `rotateY(${180 * E(p)}deg)`;
  });
});

/* ---------- G1: Lov krtků (sprity: krtek, dira, kladivo, bum) ---------- */
const HOLES = [[270,1060],[540,1060],[810,1060]];
const holesHTML = HOLES.map(([x, y]) => `<img class="abs" src="${SITE}game-sprites/mole/dira.webp" style="left:${x - 128}px;top:${y - 52}px;width:256px">`).join('');
scene('g1', 17.8, 19.633, `
  <div class="title" style="top:170px;font-size:82px">Lov krtků</div>
  <div class="abs" style="left:60px;top:560px;width:960px;height:1000px;border-radius:200px 200px 60px 60px;background:#7a4a2a;border:7px solid var(--line);box-shadow:16px 16px 0 var(--shadow);filter:url(#rough)"></div>
  <div class="spr" id="m1" style="left:${540 - 67}px;top:0;opacity:0"></div>
  <div class="spr" id="m2" style="left:${270 - 67}px;top:0;opacity:0"></div>
  ${holesHTML}
  <div class="spr" id="ham" style="transform-origin:50% 100%"></div>
  <div class="spr" id="bum" style="width:0"></div>
  <div class="pop" id="sc1" style="left:600px;top:760px;opacity:0">+10</div>
`, (lt, s) => {
  // Krtek je vykreslen PŘED děrami, takže jeho spodek schová díra. Pohyb jen přes top, bez přepisování stylu.
  const rise = (t0, t1) => E(P(lt, t0, t1));
  const m1 = s.q('#m1');
  const hit = lt >= 0.8;
  const up1 = rise(0.2, 0.5);
  setSpr(m1, 'game-sprites/mole/krtek.webp', 224, 240, 4, hit ? 0 : 3, hit ? 1 : 0, 0.6);
  m1.style.top = (1060 + 60 - 230 * up1 + (hit ? 60 * P(lt, 0.8, 1.0) : 0)) + 'px';
  m1.style.opacity = lt > 0.2 && lt < 1.0 ? 1 : 0;

  const m2 = s.q('#m2');
  const up2 = rise(1.0, 1.3);
  setSpr(m2, 'game-sprites/mole/krtek.webp', 224, 240, 4, 3, 0, 0.6);
  m2.style.top = (1060 + 60 - 230 * up2) + 'px';
  m2.style.opacity = lt > 1.0 && lt < 1.5 ? 1 : 0;

  const ham = s.q('#ham');
  setSpr(ham, 'game-sprites/mole/kladivo.webp', 128, 224, 1, 0, 0, 0.7);
  ham.style.left = (540 - 45) + 'px';
  ham.style.top = (1020 - 157) + 'px';
  ham.style.transform = `rotate(${-70 + 70 * E(P(lt, 0.45, 0.8))}deg)`;
  ham.style.opacity = lt > 0.45 && lt < 0.95 ? 1 : 0;

  const bum = s.q('#bum');
  setSpr(bum, 'game-sprites/mole/bum.webp', 128, 128, 1, 0, 0, 1.3);
  bum.style.left = (540 - 83) + 'px';
  bum.style.top = (1020 - 83) + 'px';
  bum.style.opacity = lt > 0.8 && lt < 1.1 ? 1 : 0;

  const sc = s.q('#sc1');
  sc.style.opacity = P(lt, 0.8, 0.9) * (1 - P(lt, 1.2, 1.4));
  sc.style.transform = `translateY(${-P(lt, 0.8, 1.4) * 60}px)`;
});

/* ---------- G2: Obrana galaxie (sprity: mimozemšťané, loď, výbuch) ---------- */
const TARGET = 2;            // sloupec invadera, do kterého se střílí
const SHOT_T = 0.1, HIT_T = 0.5; // výstřel začne 0,1 s, zásah dopadne 0,5 s (střela letí 0,4 s)
const invHTML = [];
for (let c = 0; c < 5; c++) invHTML.push(`<div class="spr inv" data-c="${c}"></div>`);
scene('g2', 19.633, 21.467, `
  <div class="abs" style="inset:0;background:url(${SITE}game-sprites/space/pozadi_hvezdy_1.webp) center/cover;opacity:.55"></div>
  <div class="title" style="top:170px;font-size:78px;text-shadow:6px 6px 0 var(--shadow)">Obrana galaxie</div>
  ${invHTML.join('')}
  <div class="spr" id="ship"></div>
  <div class="spr" id="bul"></div>
  <div class="spr" id="boom"></div>
  <div class="pop" id="sc2" style="left:520px;top:560px;opacity:0">+10</div>
`, (lt, s) => {
  const frame = Math.floor(lt * 6) % 4;
  const INV_W = 134;
  s.qa('.inv').forEach(el => {
    const c = +el.dataset.c;
    // cílový sloupec stojí, ostatní se kývají; zasažený zmizí přesně v HIT_T
    const x = 100 + c * 190 + (c === TARGET ? 0 : Math.sin(lt * 2.5) * 40);
    setSpr(el, 'game-sprites/space/mimozemstane.webp', 128, 128, 8, frame, 0, 1.05);
    el.style.left = x + 'px';
    el.style.top = '600px';
    el.style.opacity = (c === TARGET && lt >= HIT_T) ? 0 : 1;
  });
  const cx = 100 + TARGET * 190 + INV_W / 2;   // střed cílového invadera
  const boom = s.q('#boom');
  if (lt >= HIT_T && lt < 0.8) {
    setSpr(boom, 'game-sprites/space/vybuch.webp', 64, 64, 8, Math.min(7, Math.floor(P(lt, HIT_T, 0.8) * 8)), 0, 2.4);
    boom.style.left = (cx - 77) + 'px';
    boom.style.top = (600 + 67 - 77) + 'px';
    boom.style.opacity = 1;
  } else boom.style.opacity = 0;

  const ship = s.q('#ship');
  setSpr(ship, 'game-sprites/space/lod.webp', 96, 96, 7, 0, 0, 1.4);
  ship.style.left = (540 - 67) + 'px';
  ship.style.top = '1460px';

  const bul = s.q('#bul');
  setSpr(bul, 'game-sprites/space/strely.webp', 64, 64, 2, 0, 0, 1.6);
  const bp = P(lt, SHOT_T, HIT_T);
  bul.style.left = (cx - 51) + 'px';
  bul.style.top = (1400 - bp * 680) + 'px';
  bul.style.opacity = lt >= SHOT_T && lt < HIT_T ? 1 : 0;

  const sc = s.q('#sc2');
  sc.style.opacity = P(lt, HIT_T, HIT_T + 0.1) * (1 - P(lt, 1.2, 1.4));
  sc.style.transform = `translateY(${-P(lt, HIT_T, 1.2) * 50}px)`;
});

/* ---------- G3: Labyrint duchů (sprity: pac-man, duchové, tečky) ---------- */
const DOTS = [];
for (let i = 0; i < 9; i++) DOTS.push(`<div class="spr dot" data-i="${i}" style="left:${150 + i * 100 - 25}px;top:${980 - 25}px"></div>`);
scene('g3', 21.467, 23.3, `
  <div class="title" style="top:170px;font-size:82px">Labyrint duchů</div>
  <div class="sk abs" style="left:60px;top:600px;width:960px;height:760px;background:#1a2aa3;border-radius:44px;box-shadow:16px 16px 0 var(--shadow)"></div>
  ${DOTS.join('')}
  <div class="spr" id="pac" style="top:916px"></div>
  <div class="spr" id="gh" style="top:916px"></div>
`, (lt, s) => {
  const x = 130 + P(lt, 0.1, 1.3) * 820;
  const mouth = [0, 1, 2, 1][Math.floor(lt * 12) % 4];
  const pac = s.q('#pac');
  setSpr(pac, 'game-sprites/pacman/pac.webp', 64, 64, 3, mouth, 0, 2.2);
  pac.style.left = (x - 70) + 'px';
  const gh = s.q('#gh');
  setSpr(gh, 'game-sprites/pacman/duchove.webp', 64, 64, 8, Math.floor(lt * 6) % 2 === 0 ? 0 : 1, 0, 2.2);
  gh.style.left = Math.max(40, x - 260) + 'px';
  s.qa('.dot').forEach(d => {
    const i = +d.dataset.i;
    setSpr(d, 'game-sprites/pacman/tecky.webp', 32, 32, 3, 0, 0, 1.6);
    d.style.opacity = (150 + i * 100) < x ? 0 : 1;
  });
});

/* ---------- S6: Hry. Kurzy. AI. ---------- */
scene('s6', 23.3, 26.4, `
  <img class="abs" src="${SITE}home/funkce-hry.webp" style="left:40px;top:120px;width:320px">
  <div class="abs" id="w0" style="left:0;right:0;top:400px;text-align:center;font-family:var(--font-head);font-size:200px;font-weight:900;color:var(--text)">Hry.</div>
  <div class="abs" id="w1" style="left:0;right:0;top:730px;text-align:center;font-family:var(--font-head);font-size:200px;font-weight:900;color:var(--brand-600)">Kurzy.</div>
  <div class="abs" id="w2" style="left:0;right:0;top:1060px;text-align:center;font-family:var(--font-head);font-size:200px;font-weight:900;color:var(--orange)">AI.</div>
  <svg class="abs" style="left:0;top:0" width="1080" height="1920"><path class="ul2" pathLength="1" d="M160 1330 Q420 1300 560 1326 T930 1318" fill="none" stroke="#ffd24d" stroke-width="18" stroke-linecap="round"/></svg>
  <img class="abs" src="${SITE}home/krok-1.webp" style="right:30px;top:1400px;width:280px">
`, (lt, s) => {
  ['#w0', '#w1', '#w2'].forEach((id, i) => {
    const p = P(lt, 0.1 + i * 0.3, 0.6 + i * 0.3);
    const el = s.q(id);
    el.style.transform = `scale(${OB(p)})`;
    el.style.opacity = p > 0 ? 1 : 0;
  });
  const ul = s.q('.ul2');
  ul.style.strokeDasharray = '1';
  ul.style.strokeDashoffset = 1 - E(P(lt, 1.1, 1.7));
});

/* ---------- S7: CTA + logo + maskot (kočka z webu) ---------- */
scene('s7', 26.4, 29.1, `
  <img class="abs logo" src="${SITE}brand/logo-tmave.svg" style="left:70px;top:560px;width:940px">
  <div class="abs url" style="left:0;right:0;top:830px;text-align:center;font-family:var(--font-head);font-size:98px;font-weight:900">ucimesehrou.org</div>
  <div class="cta" style="top:1060px">Zkus to teď →</div>
  <div class="abs" style="left:0;right:0;top:1270px;display:flex;justify-content:center;gap:34px">
    <div class="lvl" style="display:flex;flex-direction:column;align-items:center;gap:12px"><img src="${SITE}ikony/zakladni.svg" style="width:190px;height:190px"><span style="font-family:var(--font-head);font-weight:800;font-size:34px">ZŠ</span></div>
    <div class="lvl" style="display:flex;flex-direction:column;align-items:center;gap:12px"><img src="${SITE}ikony/stredni.svg" style="width:190px;height:190px"><span style="font-family:var(--font-head);font-weight:800;font-size:34px">SŠ</span></div>
    <div class="lvl" style="display:flex;flex-direction:column;align-items:center;gap:12px"><img src="${SITE}ikony/prijimacky.svg" style="width:190px;height:190px"><span style="font-family:var(--font-head);font-weight:800;font-size:34px">Přijímačky</span></div>
    <div class="lvl" style="display:flex;flex-direction:column;align-items:center;gap:12px"><img src="${SITE}ikony/maturita.svg" style="width:190px;height:190px"><span style="font-family:var(--font-head);font-weight:800;font-size:34px">Maturita</span></div>
  </div>
  <img class="abs cat" src="${SITE}ikony/cat-avatar.svg" style="left:60px;bottom:120px;width:300px">
`, (lt, s) => {
  const logo = s.q('.logo');
  logo.style.transform = `scale(${0.8 + 0.2 * OB(P(lt, 0, 0.5))})`;
  logo.style.opacity = P(lt, 0, 0.3);
  const u = s.q('.url');
  u.style.opacity = P(lt, 0.4, 0.8);
  u.style.transform = `translateY(${(1 - E(P(lt, 0.4, 0.8))) * 40}px)`;
  const c = s.q('.cta');
  c.style.opacity = P(lt, 0.9, 1.2);
  c.style.transform = `translateX(-50%) scale(${1 + 0.03 * Math.sin(lt * 8)})`;
  s.qa('.lvl').forEach((el, i) => {
    const p = P(lt, 0.8 + i * 0.18, 1.3 + i * 0.18);
    el.style.transform = `scale(${OB(p)})`;
    el.style.opacity = p > 0 ? 1 : 0;
  });
  s.q('.cat').style.transform = `translateY(${Math.sin(lt * 6) * 14}px) rotate(${Math.sin(lt * 4) * 3}deg)`;
});

/* ---------- render ---------- */
window.__render = function (t) {
  $('#prog').style.width = (clamp(t / DUR) * 100) + '%';
  const bg = document.querySelector('#bgvid');
  if (bg) { const target = t % 12; if (Math.abs(bg.currentTime - target) > 0.02) bg.currentTime = target; }
  for (const s of SCENES) {
    const active = t >= s.start && t < s.end;
    const lt = t - s.start;
    s.el.style.opacity = active ? 1 : 0;
    if (active) {
      s.el.style.transform = `translateX(${(1 - E(P(lt, 0, 0.25))) * 160}px)`;
      s.update(lt, s);
    }
  }
};
window.__duration = DUR;
window.__render(0);
</script>
